<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA APEX OMEGA - SECURE</title>
    <style>
        /* Mantengo lo stile dello Screenshot_20260513_003838_Chrome.jpg */
        body { background-color: black; color: #00FF00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .status { border: 1px solid #00FF00; padding: 10px; margin: 20px; }
        button { display: block; width: 300px; padding: 15px; margin: 15px; cursor: pointer; font-weight: bold; }
        .btn-green { background-color: #00FF00; color: black; }
    </style>
</head>
<body>
    <h1>SISTEMA APEX OMEGA</h1>
    <div class="status">[PROTEZIONE LIVELLO 5 ATTIVA]</div>

    <button class="btn-green" onclick="richiediFile('kernel.pdf')">ESEGUI KERNEL.PDF</button>
    <button class="btn-green" onclick="richiediFile('decreto.pdf')">ESEGUI DECRETO SECOLARE</button>

    <script>
        async function richiediFile(nomeFile) {
            const pass = prompt("Inserire Codice Architetto:");
            
            const response = await fetch('/verify-access', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass, fileName: nomeFile })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                window.open(url); // Apre il PDF solo se il server ha dato l'OK
            } else {
                alert("ACCESSO NEGATO. Violazione rilevata.");
            }
        }
    </script>
</body>
</html>
