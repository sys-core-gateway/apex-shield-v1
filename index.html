<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX ARCHITECT OMEGA</title>
    <style>
        /* COLORI ESTRATTI DALLA TUA IMMAGINE 4067.png */
        :root {
            --bg-seta: #f4f4f2;      /* Il bianco materico dello sfondo */
            --titanio-deep: #121212;  /* Nero assoluto per il grassetto */
            --grigio-metallo: #444444; /* Per i dettagli tecnici */
        }

        body {
            background-color: var(--bg-seta) !important;
            color: var(--titanio-deep) !important;
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .elite-container {
            width: 85%;
            max-width: 850px;
        }

        /* SCRITTA OMEGA IN GRASSETTO (NIENTE SIMBOLI EGIZI) */
        .brand-logo {
            margin-bottom: 50px;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 200; /* Sottile sopra */
            letter-spacing: 1rem;
            text-transform: uppercase;
            margin: 0;
            display: block;
        }

        .bold-omega {
            font-size: 3.5rem;
            font-weight: 900; /* GRASSETTO MASSICCIO */
            letter-spacing: 1.5rem;
            text-transform: uppercase;
            display: block;
            margin-top: 10px;
            padding-left: 1.5rem; /* Bilanciamento per la spaziatura */
        }

        .jung-quote {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.3rem;
            line-height: 1.8;
            color: #222;
            margin: 50px 0;
            padding: 30px 0;
            border-top: 1px solid rgba(0,0,0,0.08);
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .technical-info {
            font-size: 0.75rem;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            color: var(--grigio-metallo);
        }

        .status-line {
            font-weight: 900;
            color: var(--titanio-deep);
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="elite-container">
        <div class="brand-logo">
            <span class="main-title">APEX ARCHITECT</span>
            <span class="bold-omega">OMEGA</span>
        </div>

        <div class="jung-quote">
            "Chi guarda fuori, sogna; chi guarda dentro, si sveglia."
        </div>

        <div class="technical-info">
            <span class="status-line">DECRETO SECOLARE 2026 — 2032</span>
            STATUS: ROOT_AUTHORIZED // OPERATORE: EROS PEDRAZZANI // MIMETIC SHIELD ACTIVE
        </div>
    </div>

</body>
</html>
