<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX ARCHITECT OMEGA</title>
    <style>
        /* COLORI ESTRATTI DALLA TUA VISIONE */
        body {
            background-color: #f2f2f0 !important; /* SFONDO BIANCO SETA */
            color: #1a1a1a !important;            /* TESTO NERO TITANIO */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        /* SIMBOLO Ω SOPRA */
        .top-symbol {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 15px;
            font-weight: 100;
            display: block;
        }

        .brand-top {
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        /* OMEGA PIENO E ARROTONDATO */
        .omega-bold {
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 40px;
        }

        .quote-box {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.3rem;
            line-height: 1.8;
            margin: 40px 0;
            padding: 25px 0;
            border-top: 1px solid rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .footer-elite {
            font-size: 0.75rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            color: #444;
        }

        .decreto-heading {
            font-weight: 900;
            display: block;
            margin-bottom: 10px;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-symbol">Ω</div>
        
        <span class="brand-top">APEX ARCHITECT</span>
        <span class="omega-bold">OMEGA</span>

        <div class="quote-box">
            "Chi guarda fuori, sogna; chi guarda dentro, si sveglia."
        </div>

        <div class="footer-elite">
            <span class="decreto-heading">DECRETO SECOLARE 2026 — 2032</span>
            STATUS: ROOT_AUTHORIZED // OPERATORE: EROS PEDRAZZANI
        </div>
    </div>

</body>
</html>
