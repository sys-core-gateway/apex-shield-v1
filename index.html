<!DOCTYPE html>
<html style="background-color: #f2f2f0 !important; color: #1a1a1a !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX ARCHITECT OMEGA</title>
    <style>
        /* RESET AGGRESSIVO */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            background-color: transparent !important; 
        }

        /* FIX KERNEL COLORI */
        html, body {
            background-color: #f2f2f0 !important; /* BIANCO SETA */
            color: #1a1a1a !important;            /* NERO TITANIO */
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .gateway-shield {
            text-align: center;
            width: 90%;
            max-width: 800px;
            /* Forza il colore su tutto il blocco */
            color: #1a1a1a !important;
        }

        /* SIMBOLO Ω SOPRA */
        .symbol-top {
            font-size: 5.5rem;
            line-height: 1;
            margin-bottom: 15px;
            font-weight: 100;
        }

        .brand-sub {
            font-size: 1.4rem;
            font-weight: 200;
            letter-spacing: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* OMEGA GRASSETTO PIENO ARROTONDATO */
        .brand-main-omega {
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 40px;
        }

        .statement {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.25rem;
            line-height: 1.8;
            padding: 30px 0;
            margin: 40px 0;
            border-top: 1px solid rgba(0,0,0,0.15);
            border-bottom: 1px solid rgba(0,0,0,0.15);
        }

        .footer-auth {
            font-size: 0.75rem;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .bold-id {
            font-weight: 900;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="gateway-shield">
        <div class="symbol-top">Ω</div>
        
        <div class="brand-sub">APEX ARCHITECT</div>
        <div class="brand-main-omega">OMEGA</div>

        <div class="statement">
            "Chi guarda fuori, sogna; chi guarda dentro, si sveglia."
        </div>

        <div class="footer-auth">
            <span class="bold-id">DECRETO SECOLARE 2026 — 2032</span>
            STATUS: ROOT_AUTHORIZED // OPERATORE: EROS PEDRAZZANI
        </div>
    </div>

</body>
</html>
