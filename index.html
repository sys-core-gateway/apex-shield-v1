        * {

            letter-spacing: 0.1em;
        }

        .main-gateway {

        }

        /* Il Logo: Pulito e Spaziatissimo */
        .logo-container {

        }

        .logo-omega {

        }

        /* Citazione Jung: Sottile e profonda */
        .quote-box {
            margin-bottom: 60px;

        }

        .quote-text {
            font-style: italic;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.8;
            color: #444;
        }

        .divider {
            height: 1px;
            background-color: var(--elite-black);
            width: 60px;
            margin: 0 auto 40px;
            opacity: 0.3;
        }

        /* Footer: Autorità ROOT */
        .system-info {
            font-size: 0.7rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            color: #888;
        }

        .decreto {
            font-weight: bold;
            color: var(--elite-black);
            margin-bottom: 5px;
        }
    </style>
</head>
